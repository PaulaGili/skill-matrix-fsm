name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Not a secret. The namespace is needed at build time.
      NEXT_PUBLIC_CANDIDATE_ID: paulagili
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: node scripts/ci/check-bundle.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
