name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Not a secret. The namespace is needed at build time.
      NEXT_PUBLIC_CANDIDATE_ID: paulagili
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The same command as on a developer machine, so the two cannot drift apart.
      - run: npm run gate
